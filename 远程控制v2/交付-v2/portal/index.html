<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>远程控制台</title>
<style>
  :root {
    --bg: #0f1420;
    --card: #1a2233;
    --card-border: #2a3550;
    --text: #e8ecf4;
    --text-dim: #8b95ab;
    --accent: #4f8cff;
    --accent-press: #3a6fd8;
    --disabled: #3a4258;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 32px);
  }
  header { margin-bottom: 28px; }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: 1px; }
  .subtitle { color: var(--text-dim); font-size: 14px; margin-top: 6px; }
  .status {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 14px; padding: 4px 12px;
    background: rgba(79, 140, 255, .12);
    border: 1px solid rgba(79, 140, 255, .35);
    border-radius: 999px; font-size: 12px; color: #9ec1ff;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #4f8cff; }
  .card {
    display: flex; align-items: center; gap: 16px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 18px 18px;
    margin-bottom: 14px;
    text-decoration: none;
    color: var(--text);
    transition: transform .08s ease, opacity .15s;
  }
  a.card:active { transform: scale(.98); background: #202a40; }
  .card.disabled { opacity: .45; pointer-events: none; }
  .icon {
    flex: none; width: 52px; height: 52px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    background: rgba(79, 140, 255, .12);
    border: 1px solid rgba(79, 140, 255, .3);
    border-radius: 12px;
  }
  .card.disabled .icon { background: rgba(139, 149, 171, .08); border-color: var(--disabled); }
  .info { flex: 1; min-width: 0; }
  .title { font-size: 17px; font-weight: 600; }
  .desc { font-size: 13px; color: var(--text-dim); margin-top: 4px; line-height: 1.45; }
  .arrow { color: var(--text-dim); font-size: 18px; flex: none; }
  footer { text-align: center; color: var(--text-dim); font-size: 12px; margin-top: 30px; line-height: 1.8; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>远程控制台</h1>
    <div class="subtitle">通过 Tailscale 安全连接到你的电脑</div>
    <div class="status"><span class="dot"></span>加密通道 · 仅限授权设备</div>
  </header>

  <!-- 原 Agent Web UI：挂在 443（根路径，不带端口），域名与当前页相同 -->
  <a class="card" id="agent-ui" href="/">
    <div class="icon">🤖</div>
    <div class="info">
      <div class="title">Agent 工作台</div>
      <div class="desc">电脑端 Agent 的 Web 界面，查看会话与任务进度</div>
    </div>
    <div class="arrow">›</div>
  </a>

  <!-- R2：Web CMD 终端（8443 站点 /ttyd/ 子路径） -->
  <a class="card" id="web-cmd" href="/ttyd/">
    <div class="icon">⌨️</div>
    <div class="info">
      <div class="title">命令行终端</div>
      <div class="desc">在手机上直接操作电脑的 PowerShell 命令行</div>
    </div>
    <div class="arrow">›</div>
  </a>

  <!-- R3 预留：远程桌面（当前迭代未启用） -->
  <div class="card disabled">
    <div class="icon">🖥️</div>
    <div class="info">
      <div class="title">远程桌面</div>
      <div class="desc">操作电脑的文件资源管理器和 Edge 浏览器（即将上线）</div>
    </div>
    <div class="arrow">›</div>
  </div>

  <footer>
    迭代 2.0 · R1 门户 + R2 Web CMD<br>
    原 1.0 服务运行不受影响
  </footer>
</div>
<script>
  // 原 Agent UI 在 443 根路径：与当前页面同域名、去掉端口即可
  document.getElementById('agent-ui').href = 'https://' + location.hostname;
  // R2 Web CMD：8443 站点 /ttyd/ 子路径
  document.getElementById('web-cmd').href = 'https://' + location.hostname + ':8443/ttyd/';
</script>
</body>
</html>
